;
; Unit tests without Odoo and without a database (spec 9.9, fast feedback):
; the calculation engine (pure Python, spec 7.2) and the tools of the test
; protocol. The setup is in conftest.py of the repository; the tests of the ORM
; run with Odoo, see _dev/werkzeuge/test_protocol.sh.
[pytest]
testpaths =
    l10n_de_euer/tests
    _dev/tests
python_files =
    test_engine_*.py
    test_adjustment_engine.py
    test_coverage_engine.py
    test_depreciation.py
    test_export_engine.py
    test_form_calc.py
    test_integrity_engine.py
    test_release_units.py
    test_revenue.py
    test_dev_tools.py
